<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            /* Мягкий градиент как на 4-м референсе */
            background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%);
            width: 850px; height: 480px; display: flex; align-items: center; justify-content: center;
        }
        .glass-card {
            width: 760px; height: 400px;
            /* Эффект матового стекла */
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            display: flex; padding: 40px; position: relative; overflow: hidden;
        }
        /* Левая часть: Информация */
        .info-sec {
            flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-right: 30px; z-index: 2;
        }
        .badge {
            align-self: flex-start; padding: 6px 16px; background: rgba(255, 255, 255, 0.6);
            color: #6366f1; border-radius: 20px; font-size: 12px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.1);
        }
        .title { font-size: 38px; font-weight: 800; color: #1e1b4b; line-height: 1.1; margin-bottom: 10px; letter-spacing: -1px; }
        .sphere { font-size: 16px; color: #475569; font-weight: 500; margin-bottom: 20px; }
        .owner-box { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.4); padding: 10px 16px; border-radius: 16px; align-self: flex-start; }
        .owner-avatar { width: 32px; height: 32px; border-radius: 50%; background: #cbd5e1; }
        .owner-name { font-size: 14px; font-weight: 700; color: #1e293b; }
        .owner-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; }

        /* Правая часть: Финансы */
        .stats-sec {
            width: 260px; display: flex; flex-direction: column; gap: 15px; justify-content: center; z-index: 2;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px; padding: 18px 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.03);
            display: flex; flex-direction: column;
        }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .stat-value { font-size: 26px; color: #0f172a; font-weight: 800; margin-top: 4px; }
        .stat-value span { font-size: 14px; color: #6366f1; }
        
        /* Декоративные круги */
        .circle1 { position: absolute; top: -60px; left: -60px; width: 250px; height: 250px; background: rgba(167, 139, 250, 0.3); border-radius: 50%; filter: blur(40px); }
        .circle2 { position: absolute; bottom: -80px; right: -80px; width: 300px; height: 300px; background: rgba(96, 165, 250, 0.3); border-radius: 50%; filter: blur(50px); }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="circle1"></div>
        <div class="circle2"></div>
        
        <div class="info-sec">
            <div>
                <div class="badge" id="org_type">СМИ</div>
                <div class="title" id="org_name">Название</div>
                <div class="sphere" id="sphere">Сфера деятельности</div>
            </div>
            <div class="owner-box">
                <div style="display:flex; flex-direction:column;">
                    <span class="owner-label">Владелец</span>
                    <span class="owner-name" id="owner">Игрок</span>
                </div>
            </div>
        </div>
        
        <div class="stats-sec">
            <div class="stat-card">
                <div class="stat-label">Уровень компании</div>
                <div class="stat-value" id="level">LVL 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Доход в час</div>
                <div class="stat-value" id="income">0 <span>RUB</span></div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));">
                <div class="stat-label">Накоплено</div>
                <div class="stat-value" id="acc">0 <span>RUB</span></div>
            </div>
        </div>
    </div>
    <script>
        window.renderData = (data) => {
            document.getElementById('org_type').innerText = data.org_type;
            document.getElementById('org_name').innerText = data.name;
            document.getElementById('sphere').innerText = data.sphere;
            document.getElementById('owner').innerText = data.owner;
            document.getElementById('level').innerText = 'LVL ' + data.level;
            document.getElementById('income').innerHTML = data.income.toLocaleString('ru-RU') + ' <span>RUB</span>';
            document.getElementById('acc').innerHTML = data.acc.toLocaleString('ru-RU') + ' <span>RUB</span>';
        };
    </script>
</body>
</html>
