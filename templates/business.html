<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #d4fc79, #96e6a1); /* Свежий зеленый градиент */
            width: 800px; height: 450px; display: flex; align-items: center; justify-content: center;
        }
        .glass-card {
            width: 720px; height: 350px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 40px; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; overflow: hidden;
        }
        .header { display: flex; justify-content: space-between; align-items: flex-start; z-index: 1; }
        .biz-name { font-size: 32px; font-weight: 800; color: #064e3b; letter-spacing: -0.5px; }
        .biz-level {
            background: #ffffff; color: #059669; padding: 6px 16px;
            border-radius: 20px; font-weight: 800; font-size: 14px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.15);
        }
        .stats { display: flex; gap: 30px; z-index: 1; margin-top: 20px; }
        .stat-box {
            flex: 1; background: rgba(255, 255, 255, 0.6);
            border-radius: 20px; padding: 20px; border: 1px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
        .stat-label { color: #475569; font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .stat-value { color: #0f172a; font-size: 28px; font-weight: 800; margin-top: 6px; }
        .footer { display: flex; justify-content: space-between; align-items: flex-end; z-index: 1; }
        .owner { color: #475569; font-size: 14px; font-weight: 500; }
        .owner span { color: #0f172a; font-weight: 700; }
        
        /* Декоративные круги на фоне */
        .circle1 { position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(52, 211, 153, 0.2); border-radius: 50%; filter: blur(30px); }
        .circle2 { position: absolute; bottom: -50px; left: -50px; width: 250px; height: 250px; background: rgba(59, 130, 246, 0.15); border-radius: 50%; filter: blur(40px); }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="circle1"></div>
        <div class="circle2"></div>
        
        <div class="header">
            <div class="biz-name" id="biz_name">Название</div>
            <div class="biz-level" id="biz_level">LVL 1</div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Доход в час</div>
                <div class="stat-value" id="income">0 💰</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Накоплено</div>
                <div class="stat-value" id="acc">0 💰</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="owner">Владелец бизнеса: <span id="owner"></span></div>
        </div>
    </div>
    <script>
        window.renderData = (data) => {
            document.getElementById('biz_name').innerText = data.name;
            document.getElementById('biz_level').innerText = 'LVL ' + data.level;
            document.getElementById('income').innerText = data.income.toLocaleString('ru-RU') + ' 💰';
            document.getElementById('acc').innerText = data.acc.toLocaleString('ru-RU') + ' 💰';
            document.getElementById('owner').innerText = data.owner;
        };
    </script>
</body>
</html>
